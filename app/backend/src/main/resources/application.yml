server:
  port: 8080          # 백엔드 API 서버가 열리는 포트 (http://localhost:8080)

spring:
  application:
    name: guide-match

  # 파일 업로드 최대 크기 (기본 1MB는 문서엔 작아서 10MB로 늘림)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # DB 접속 정보 — 실제 값은 .env 파일에서 읽어온다 (코드에 비밀번호를 직접 안 적음)
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA 설정 아래에 JWT 설정 추가
  jpa:
    hibernate:
      # update = 자바 엔티티(테이블 설계)를 보고 DB에 테이블을 자동 생성/수정
      # (개발 초기엔 편리. 나중에 운영 단계에선 migration 방식으로 바꿀 예정)
      ddl-auto: update
    show-sql: true     # 실행되는 SQL을 콘솔에 출력 (학습/디버깅용)
    properties:
      hibernate:
        format_sql: true

  # OAuth2 소셜 로그인 (구글/카카오). 키가 없으면 소셜 버튼은 비활성/에러, 앱 기동은 정상.
  #
  # 등록 정보(client-id/secret/scope/엔드포인트)는 여기(yml)가 아니라
  # com.guidematch.config.OAuth2ClientRegistrationConfig 에서 코드로 직접 만든다.
  # 이유: Spring Boot의 OAuth2ClientProperties는 @ConfigurationProperties 빈이라
  #   spring.security.oauth2.client.registration.* 아래에 google/kakao 블록이 "존재"하기만 하면
  #   (client-id가 빈 문자열이어도) 컨텍스트 초기화 중 즉시 검증(validate())되어
  #   "Client id ... must not be empty" 로 애플리케이션 기동 자체가 실패한다.
  #   이 검증은 어떤 빈이 실제로 그 값을 쓰는지와 무관하게 항상 실행되므로,
  #   커스텀 ClientRegistrationRepository 빈을 따로 둬도 우회되지 않는다.
  #   그래서 이 블록 자체를 비워, 키가 없는 provider는 등록을 건너뛰고
  #   (OAuth2ClientRegistrationConfig에서 조건부로 생성) 앱은 항상 정상 기동하게 한다.

# JWT(로그인 토큰) 설정
jwt:
  secret: ${JWT_SECRET}        # 토큰 서명에 쓰는 비밀키 (.env에서 읽음)
  expiration-ms: 86400000      # 토큰 유효시간: 24시간 (밀리초 단위)

# Supabase Storage(파일 보관소) 설정
supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  storage:
    credentials-bucket: credentials   # 자격증 파일을 저장할 버킷 이름
    # 관광통역안내사 인증용 자격증·신분증 저장 버킷. 민감 PII이므로 반드시 Supabase에서 "비공개(private)" 버킷으로 생성할 것.
    # 어드민 열람은 서명(signed) URL로만 이뤄지며, 공개 URL로는 접근되지 않는다.
    verification-bucket: ${SUPABASE_VERIFICATION_BUCKET:verification}

# Kakao Map REST API (역지오코딩/장소검색). 키가 없으면 GPS 자동감지만 비활성, 앱은 정상 동작.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

# Google Cloud Translation API v2. 키가 없으면 장소명이 한국어 원문 그대로 표시됨.
google:
  translate-api-key: ${GOOGLE_TRANSLATE_API_KEY:}

# PortOne V2 결제(에스크로). 키가 없으면 결제 기능만 비활성(PortOneClient.isEnabled()=false), 앱 기동·예약 흐름은 정상.
portone:
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}

# 플랫폼 수수료율 (정산액 = 총액 − round(총액 × rate)). 정산 생성 시점에 Settlement에 스냅샷된다.
payment:
  commission-rate: ${PAYMENT_COMMISSION_RATE:0.15}

# Resend(https://resend.com) 트랜잭션 이메일. 키가 없으면 인증/재설정 메일 발송만 스킵되고 앱은 정상 동작.
resend:
  api-key: ${RESEND_API_KEY:}
  # 커스텀 도메인 인증 전까지는 Resend 기본 테스트 발신자 사용 (계정 소유자 이메일로만 발송 가능)
  from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}

# 이메일 링크(인증/비번재설정)가 가리킬 프론트엔드 주소
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
